          var sceneStr = '';
          if (genMode === 'scene_collection' && selectedScenes.length > 0) {
            sceneStr = '场景选择：' + selectedScenes.map(function(id) {
              var found = scenes.filter(function(s) { return s.id === id; });
              return found.length > 0 ? found[0].label : id;
            }).join('、');
          } else {
            sceneStr = '图文套装模式，无需场景图';
          }

          // Build system prompt
          var systemPrompt = '你是一位专业的酒水电商内容策划师，擅长为低度数酒（5-12°葡萄酒、3-8°果酒、气泡酒、甜酒）创作社交媒体内容。\n\n根据用户输入的产品信息，生成3组不同风格的内容方案。每组方案包含封面和内容。\n\n## 封面风格规则\n当前选定封面风格：' + selectedCoverDesc + '\n\n### 背景颜色规则\n背景颜色由产品风味动态决定：青苹果→淡绿、桃子→淡粉、荔枝→淡紫、蓝莓→淡蓝紫、菠萝→暖黄。颜色柔和淡雅，不喧宾夺主。\n\n### 封面文字叠加\n封面图prompt中不要包含任何文字。额外输出text_overlays（3-5条手写标注文字，每条2-6字，口语化卖点）和text_position（left/right）。\n\n## 输出JSON格式（严格遵循）\n{\n  "results": [\n    {\n      "style_name": "风格名称（如：文艺清新、活力种草、质感生活等）",\n      "style_desc": "风格一句话描述",\n      "cover": {\n        "title": "封面图标题（10-20字）",\n        "image_prompt": "英文图片描述，不含任何文字",\n        "text_overlays": ["清爽解腻", "6°微醺", "荔枝味"],\n        "text_position": "right"\n      },\n      "contents": [\n        {\n          "scene_name": "场景名称",\n          "title": "文案标题（15字以内，带emoji）",\n          "body": "文案正文（150-250字）",\n          "tags": ["标签1", "标签2", "标签3"],\n          "image_prompt": "英文图片描述，不含文字"\n        }\n      ]\n    }\n  ]\n}\n\n## 注意事项\n- 文案风格：小红书风格活泼有emoji，抖音风格口语化有节奏感\n- 图片prompt必须是纯英文，描述具体视觉元素\n- 场景图数量根据用户选择的场景数决定\n- 只输出JSON，不要其他内容';

          var userMessage = '产品信息：品牌=' + productInfo.name + '，产地=' + productInfo.origin + '，酒精度=' + productInfo.alcohol + '，味道描述=' + productInfo.taste + '，目标人群=' + productInfo.targetAudience + '\n\n' + sceneStr + '\n\n发布平台：' + platform + '\n\n生成模式：' + (genMode === 'scene_collection' ? '场景合集' : '图文套装') + '\n\n颜色风味：' + productInfo.taste;


          // SSE stream reader - collects streamed content from Cloudflare Worker
          function readSSEStream(body) {
            var reader = body.getReader();
            var decoder = new TextDecoder();
            var fullContent = '';
            function pump() {
              return reader.read().then(function(result) {
                if (result.done) return fullContent;
                var chunk = decoder.decode(result.value, { stream: true });
                var lines = chunk.split('\n');
                for (var i = 0; i < lines.length; i++) {
                  var line = lines[i].trim();
                  if (line.startsWith('data: ')) {
                    var data = line.substring(6);
                    if (data === '[DONE]') continue;
                    try {
                      var parsed = JSON.parse(data);
                      if (parsed.choices && parsed.choices[0] && parsed.choices[0].delta && parsed.choices[0].delta.content) {
                        fullContent += parsed.choices[0].delta.content;
                      }
                    } catch(e) {}
                  }
                }
                return pump();
              });
            }
            return pump();
          }

          // Call Cloudflare Worker API proxy
          console.error('=== 开始调用文案API ===', { url: proxyUrl + '/chat', model: 'glm-4-flash' });

          // Step 1: Call chat completions to generate content
          fetch(proxyUrl + '/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              apiKey: apiKey,
              model: 'glm-4-flash',
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userMessage },
              ],
              temperature: 0.8,
              max_tokens: 4096,
            }),
          })
          .then(function(resp) {
            console.error('=== 文案API响应 ===', { status: resp.status, ok: resp.ok });
            if (!resp.ok) {
              return resp.json().then(function(err) {
                console.error('=== 文案API错误详情 ===', err);
                throw new Error('文案生成失败: ' + (err.error || err.message || JSON.stringify(err)));
              });
            }
            return readSSEStream(resp.body);
          })
          .then(function(content) {
            console.error('=== 流式文案完成 ===', { length: content.length, preview: content.substring(0, 200) });
            if (!content) {
              throw new Error('文案生成返回为空');
            }
            // Try to extract JSON from the response
            var jsonMatch = content.match(/\{[\s\S]*\}/);
            var jsonStr = jsonMatch ? jsonMatch[0] : content;
            var parsed;
            try {
              parsed = JSON.parse(jsonStr);
            } catch(e) {
              console.error('=== JSON解析失败 ===', { content: content, error: e.message });
              throw new Error('解析AI返回结果失败: ' + e.message);
            }
            if (!parsed.results || parsed.results.length === 0) {
              throw new Error('AI返回结果格式异常，未找到results');
            }

            console.error('=== 解析结果成功 ===', { resultsCount: parsed.results.length });

            // Step 2: Generate images for all prompts
            setToast({ message: '文案已生成，正在生成图片...', type: 'info' });

            var allImagePrompts = [];
            parsed.results.forEach(function(r, ri) {
              if (r.cover && r.cover.image_prompt) {
                allImagePrompts.push({ key: 'result_' + ri + '_cover', url: null, prompt: r.cover.image_prompt });
              }
              if (r.contents) {
                r.contents.forEach(function(c, ci) {
                  if (c.image_prompt) {
                    allImagePrompts.push({ key: 'result_' + ri + '_content_' + ci, url: null, prompt: c.image_prompt });
                  }
                });
              }
            });

            console.error('=== 开始生成图片 ===', { totalCount: allImagePrompts.length });

            if (allImagePrompts.length === 0) {
              // No images to generate
              setResultData(parsed);
              setLoading(false);
              setToast({ message: '内容生成完成！共 ' + parsed.results.length + ' 组方案', type: 'success' });
              return;
            }

            var completedCount = 0;
            var totalCount = allImagePrompts.length;

            allImagePrompts.forEach(function(item) {
              console.error('=== 生成图片 ===', { prompt: item.prompt.substring(0, 50) });
              fetch(proxyUrl + '/image', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  apiKey: apiKey,
                  model: 'cogview-3-flash',
                  prompt: item.prompt,
                  size: '1024x1024',
                  n: 1,
                }),
              })
              .then(function(resp) {
                console.error('=== 图片API响应 ===', { status: resp.status, ok: resp.ok });
                if (!resp.ok) {
                  return resp.json().then(function(err) {
                    console.error('=== 图片API错误详情 ===', err);
                    throw new Error('图片生成失败: ' + (err.error || err.message || JSON.stringify(err)));
                  });
                }
                return resp.json();
              })
              .then(function(imgData) {
                console.error('=== 图片API成功 ===', imgData);
                // cogview-3-flash returns base64 image
                var imageUrlResult = null;
                if (imgData.data && imgData.data[0]) {
                  if (imgData.data[0].url) {
                    imageUrlResult = imgData.data[0].url;
                  } else if (imgData.data[0].b64_json) {
                    imageUrlResult = 'data:image/png;base64,' + imgData.data[0].b64_json;
                  }
                }
                item.url = imageUrlResult;

                // Map image back to result
                var parts = item.key.split('_');
                var ri = parseInt(parts[1], 10);
                if (parts[2] === 'cover') {
                  if (parsed.results[ri] && parsed.results[ri].cover) {
                    parsed.results[ri].cover.image_url = imageUrlResult;
                  }
                } else {
                  var ci = parseInt(parts[3], 10);
                  if (parsed.results[ri] && parsed.results[ri].contents && parsed.results[ri].contents[ci]) {
                    parsed.results[ri].contents[ci].image_url = imageUrlResult;
                  }
                }

                completedCount++;
                if (completedCount >= totalCount) {
                  console.error('=== 所有图片生成完成 ===');
                  setResultData(JSON.parse(JSON.stringify(parsed)));
                  setLoading(false);
                  setToast({ message: '内容生成完成！共 ' + parsed.results.length + ' 组方案', type: 'success' });
                }
              })
              .catch(function(err) {
                console.error('=== 图片生成失败 ===', err);
                completedCount++;
                item.url = null;
                if (completedCount >= totalCount) {
                  setResultData(JSON.parse(JSON.stringify(parsed)));
                  setLoading(false);
                  setToast({ message: '内容生成完成（部分图片生成失败）', type: 'success' });
                }
              });
            });
          })
          .catch(function(err) {
            console.error('=== 生成失败 ===', err);
            setToast({ message: err.message, type: 'error' });
            setLoading(false);
          });
        } catch(e) {
          console.error('=== 意外错误 ===', e);
          setToast({ message: '生成出错: ' + e.message, type: 'error' });
          setLoading(false);
        }
      }

      function handleSaveApiKey() {
        try { localStorage.setItem('glm_api_key', apiKey); localStorage.setItem('proxy_url', proxyUrl); } catch(e) {}
        setToast({ message: '设置已保存', type: 'success' });
      }

      function updateProductInfo(field, value) {
        setProductInfo(function(prev) {
          var next = {};
          for (var k in prev) next[k] = prev[k];
          next[field] = value;
          return next;
        });
      }

      function handleFileUpload(file) {
        if (!file) return;
        if (file.type.indexOf('image/') !== 0) {
          setToast({ message: '请上传图片格式的文件', type: 'error' });
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          setToast({ message: '图片大小不能超过 10MB', type: 'error' });
          return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
          setImagePreview(e.target.result);
        };
        reader.readAsDataURL(file);
      }

      function handleDrop(e) {
        e.preventDefault();
        var file = e.dataTransfer.files[0];
        handleFileUpload(file);
      }

      function handleDragOver(e) {
        e.preventDefault();
      }

      function handleResultToast(msg, type) {
        setToast({ message: msg, type: type });
      }

      /* ====== Result View ====== */
      if (resultData) {
        /* Keyboard shortcuts for result selection */
        useEffect(function() {
          function handleKeyDown(e) {
            var num = parseInt(e.key, 10);
            if (num >= 1 && num <= 3 && resultData.results && resultData.results[num - 1]) {
              setSelectedResult(num - 1);
            }
          }
          window.addEventListener('keydown', handleKeyDown);
          return function() { window.removeEventListener('keydown', handleKeyDown); };
        }, [resultData, setSelectedResult]);

        return (
          <div className="min-h-screen bg-surface">
            <Navbar
              onSettingsClick={function() { setSettingsOpen(true); }}
              onContentClick={function() { setToast({ message: '内容库功能开发中...', type: 'info' }); }}
            />
            <ResultPage
              data={resultData}
              selectedResult={selectedResult}
              onSelectResult={setSelectedResult}
              onBack={function() { setResultData(null); }}
              onToast={handleResultToast}
            />
            <SettingsPanel
              isOpen={settingsOpen}
              onClose={function() { setSettingsOpen(false); }}
              apiKey={apiKey}
              onApiKeyChange={setApiKey}
              proxyUrl={proxyUrl}
              onProxyUrlChange={setProxyUrl}
              onSave={handleSaveApiKey}
            />
            {toast && <Toast message={toast.message} type={toast.type} onClose={function() { setToast(null); }} />}
          </div>
        );
      }

      /* ====== Editor View ====== */
      return (
        <div className="min-h-screen bg-surface">
          <Navbar
            onSettingsClick={function() { setSettingsOpen(true); }}
            onContentClick={function() { setToast({ message: '内容库功能开发中...', type: 'info' }); }}
          />

          <main className="max-w-[1200px] mx-auto px-6 py-8 space-y-8">

            {/* Section 1: Product Info */}
            <Card>
              <SectionTitle number="1" title="产品信息" />
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">产品名称</label>
                  <input type="text" value={productInfo.name} onChange={function(e) { updateProductInfo('name', e.target.value); }} placeholder="如：莫高黑比诺干红葡萄酒" className="w-full h-10 px-3 text-sm border border-border rounded-lg bg-white text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all duration-200" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">产地</label>
                  <input type="text" value={productInfo.origin} onChange={function(e) { updateProductInfo('origin', e.target.value); }} placeholder="如：法国波尔多" className="w-full h-10 px-3 text-sm border border-border rounded-lg bg-white text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all duration-200" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">酒精度</label>
                  <input type="text" value={productInfo.alcohol} onChange={function(e) { updateProductInfo('alcohol', e.target.value); }} placeholder="如：13.5%vol" className="w-full h-10 px-3 text-sm border border-border rounded-lg bg-white text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all duration-200" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">目标人群</label>
                  <input type="text" value={productInfo.targetAudience} onChange={function(e) { updateProductInfo('targetAudience', e.target.value); }} placeholder="如：25-35岁都市女性" className="w-full h-10 px-3 text-sm border border-border rounded-lg bg-white text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all duration-200" />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">味道描述</label>
                  <textarea value={productInfo.taste} onChange={function(e) { updateProductInfo('taste', e.target.value); }} placeholder="如：入口柔和，带有黑樱桃和淡淡橡木香气，单宁细腻..." rows={3} className="w-full px-3 py-2.5 text-sm border border-border rounded-lg bg-white text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-brand/30 focus:border-brand transition-all duration-200 resize-none" />
                </div>
                <div className="md:col-span-2">
                  <label className="block text-xs font-medium text-text-secondary mb-1.5">上传产品图片</label>
                  <div
                    onDrop={handleDrop}
                    onDragOver={handleDragOver}
                    onClick={function() { var el = document.getElementById('productImageInput'); if (el) el.click(); }}
                    className="relative w-full h-[120px] border-2 border-dashed border-border rounded-xl bg-white/50 hover:border-brand hover:bg-brand-light/30 cursor-pointer transition-all duration-200 flex flex-col items-center justify-center gap-1.5 overflow-hidden"
                  >
                    {imagePreview ? (
                      <div className="absolute inset-0">
                        <img src={imagePreview} alt="产品预览" className="w-full h-full object-cover" />
                        <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200">
                          <span className="text-white text-xs font-medium bg-black/50 px-3 py-1.5 rounded-lg">点击更换图片</span>
                        </div>
                      </div>
                    ) : (
                      <div className="flex flex-col items-center gap-1.5">
                        <span className="text-2xl">{'\uD83D\uDCF7'}</span>
                        <span className="text-sm text-text-secondary font-medium">点击或拖拽上传产品图片</span>
                        <span className="text-xs text-gray-400">支持 JPG、PNG、WebP，最大 10MB</span>
                      </div>
                    )}
                    <input id="productImageInput" type="file" accept="image/*" onChange={function(e) { handleFileUpload(e.target.files[0]); }} className="hidden" />
                  </div>
                </div>
              </div>
            </Card>

            {/* Section 2: Platform */}
            <Card>
              <SectionTitle number="2" title="发布平台" />
              <div className="flex gap-3">
                {[
                  { id: 'xiaohongshu', label: '小红书' },
                  { id: 'douyin', label: '抖音' },
                  { id: 'both', label: '双平台' },
                ].map(function(p) {
                  var isSelected = platform === p.id;
                  return (
                    <label key={p.id} className={'flex items-center gap-2 px-5 py-2.5 rounded-[20px] text-sm font-medium cursor-pointer border transition-all duration-200 ' + (isSelected ? 'border-brand bg-brand-light text-brand' : 'border-border bg-white text-text-secondary hover:border-gray-300')}>
                      <input type="radio" name="platform" value={p.id} checked={isSelected} onChange={function() { setPlatform(p.id); }} className="hidden" />
                      <span className={'w-3.5 h-3.5 rounded-full border-2 flex items-center justify-center ' + (isSelected ? 'border-brand' : 'border-gray-300')}>
                        {isSelected ? <span className="w-1.5 h-1.5 rounded-full bg-brand"></span> : null}
                      </span>
                      {p.label}
                    </label>
                  );
                })}
              </div>
            </Card>

            {genMode === 'scene_collection' ? (
            <Card>
              <SectionTitle number="3" title="使用场景" />
              <div className="flex flex-wrap gap-2.5">
                {scenes.map(function(scene) {
                  var isSelected = selectedScenes.indexOf(scene.id) >= 0;
                  return (
                    <button key={scene.id} onClick={function() { toggleScene(scene.id); }} className={'px-4 py-2 rounded-[20px] text-sm font-medium border cursor-pointer transition-all duration-200 ' + (isSelected ? 'border-brand bg-brand-light text-brand' : 'border-border bg-white text-text-secondary hover:border-gray-300')}>
                      {scene.icon} {scene.label}
                    </button>
                  );
                })}
              </div>
              {selectedScenes.length > 0 ? <p className="mt-3 text-xs text-text-secondary">已选择 {selectedScenes.length} 个场景</p> : null}
            </Card>
          ) : null}

            {/* Section 4: Generation Mode */}
            <Card>
              <SectionTitle number={genMode === 'scene_collection' ? '4' : '3'} title="生成模式" />
              <div className="flex gap-3">
                {[
                  { id: 'photo_set', title: '图文套装', desc: '封面 + 1 张产品图' },
                  { id: 'scene_collection', title: '场景合集', desc: '封面 + N 张场景图' },
                ].map(function(mode) {
                  var isSelected = genMode === mode.id;
                  return (
                    <button key={mode.id} onClick={function() { setGenMode(mode.id); }} className={'flex-1 p-4 rounded-xl text-left border cursor-pointer transition-all duration-200 ' + (isSelected ? 'border-brand bg-brand-light' : 'border-border bg-white hover:border-gray-300')}>
                      <p className={'text-sm font-semibold ' + (isSelected ? 'text-brand' : 'text-text-primary')}>{mode.title}</p>
                      <p className="text-xs text-text-secondary mt-1">{mode.desc}</p>
                    </button>
                  );
                })}
              </div>
            </Card>

            {/* Section 5: Cover Style */}
            <Card>
              <SectionTitle number={genMode === 'scene_collection' ? '5' : '4'} title="封面风格" />
              <div className="grid grid-cols-2 gap-3">
                {coverStyles.map(function(style) {
                  var isSelected = coverStyle === style.id;
                  return (
                    <button key={style.id} onClick={function() { setCoverStyle(style.id); }} className={'p-4 rounded-xl text-left border cursor-pointer transition-all duration-200 ' + (isSelected ? 'border-brand bg-brand-light' : 'border-border bg-white hover:border-gray-300')}>
                      <p className={'text-sm font-semibold ' + (isSelected ? 'text-brand' : 'text-text-primary')}>{style.title}</p>
                      <p className="text-xs text-text-secondary mt-1">{style.desc}</p>
                    </button>
                  );
                })}
              </div>
            </Card>

            {/* Section 6: Generation Guide */}
            <Card>
              <SectionTitle number={genMode === 'scene_collection' ? '6' : '5'} title="生成指南" />
              <div className="grid grid-cols-2 gap-3">
                {guides.map(function(guide, idx) {
                  return (
                    <div key={idx} className="p-4 rounded-xl border border-border bg-gray-50/50">
                      <p className="text-sm font-semibold text-text-primary">{guide.title}</p>
                      <p className="text-xs text-text-secondary mt-1.5 leading-relaxed">{guide.desc}</p>
                    </div>
                  );
                })}
              </div>
            </Card>

            {/* Generate Button */}
            <button
              onClick={handleGenerate}
              disabled={loading}
              className={'w-full h-12 rounded-lg text-white text-sm font-semibold transition-all duration-200 ' + (loading ? 'bg-brand/60 cursor-not-allowed' : 'bg-brand hover:bg-brand-hover hover:-translate-y-px shadow-sm hover:shadow-md')}
            >
              {loading ? (
                <span className="flex items-center justify-center gap-2">
                  <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                  </svg>
                  正在生成中...
                </span>
              ) : '一键生成内容'}
            </button>

            <div className="h-8"></div>
          </main>

          {/* Settings Panel */}
          <SettingsPanel
            isOpen={settingsOpen}
            onClose={function() { setSettingsOpen(false); }}
            apiKey={apiKey}
            onApiKeyChange={setApiKey}
            proxyUrl={proxyUrl}
            onProxyUrlChange={setProxyUrl}
            onSave={handleSaveApiKey}
          />

          {/* Toast */}
          {toast ? <Toast message={toast.message} type={toast.type} onClose={function() { setToast(null); }} /> : null}
        </div>
      );
    }

    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
